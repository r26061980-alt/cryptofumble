[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

# Красивые пути: фронт зовёт /api/price и /api/search,
# Netlify тихо проксирует на реальные функции.
[[redirects]]
  from = "/api/price"
  to = "/.netlify/functions/price"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

# Короткая ссылка для шеринга результата: /r/AbC123 -> share.js?id=AbC123
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/share?id=:splat"
  status = 200
