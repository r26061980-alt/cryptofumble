[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

# Еженедельная рассылка по прибыли/убытку всем, кто подключил портфель через
# Telegram-бота (см. netlify/functions/telegram-digest.js) — понедельник,
# 9:00 UTC (12:00 по Москве). Расписание у Netlify — всегда в UTC.
[functions."telegram-digest"]
  schedule = "0 9 * * 1"

# Ежедневный автопостинг в канал @CryptoFumble (см.
# netlify/functions/telegram-channel-post.js) — каждый день, 7:00 UTC
# (10:00 по Москве, без перевода времени). Расписание у Netlify — всегда в UTC.
[functions."telegram-channel-post"]
  schedule = "0 7 * * *"

# Проверка новых исторических максимумов (ATH) по всем 9 монетам — см.
# netlify/functions/check-ath.js. Раз в 15 минут, UTC (расписание у Netlify
# всегда в UTC). Если у монеты новый ATH — уведомление уходит всем, кто
# включил пуш-уведомления (netlify/functions/push-subscribe.js).
[functions."check-ath"]
  schedule = "*/15 * * * *"

# Красивые пути: фронт зовёт /api/price и /api/search,
# Netlify тихо проксирует на реальные функции.
[[redirects]]
  from = "/api/price"
  to = "/.netlify/functions/price"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/push-subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

# Короткая ссылка для шеринга результата: /r/AbC123 -> функция share.js
#
# ВАЖНО: Netlify официально НЕ подставляет плейсхолдер из "from" (ни :splat,
# ни именованный :id) в query string у "to" при rewrite на функцию —
# это подтверждённое ограничение самой платформы, не ошибка в конфиге
# (https://answers.netlify.com/t/redirect-rewrite-to-function-seems-broken/18595).
# Именно поэтому картинка все прошлые разы выходила пустой: id вообще не
# доезжал до share.js. Поэтому здесь без "?id=" — share.js сам достаёт id
# из настоящего входящего пути запроса (event.path), который Netlify
# передаёт функции без изменений.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/share"
  status = 200

# Фаза 2 — SEO-страницы coin+year. EN-файлы лежат плоско в корне
# (bitcoin-2013.html и т.д.), RU-файлы физически лежат внутри папки ru/
# (ru/ru-bitcoin-2013.html и т.д., так получилось при загрузке через
# GitHub веб-интерфейс) — здесь просто статически переписываем красивый
# путь на реальный файл, без :splat/:id и подстановки в query string,
# так что ограничение платформы из комментария про /r/* здесь не применяется.

